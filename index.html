<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livestream Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7ac9e7;
    --primary-glow: rgba(122, 201, 231, 0.6);
    --accent: #ffffff;
    --bg-dark: #070913;
    --text: #ffffff;
    --text-dim: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: 'Montserrat', sans-serif; color: var(--text); }

  /* OBS Canvas (1920x1080 Aspect Ratio Safety) */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #0e172a 0%, var(--bg-dark) 100%);
  }

  /* Canvas Visuals */
  canvas#visualizer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* Light FX Layer */
  .light-beam {
    position: absolute;
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    animation: pulseGlow 4s ease-in-out infinite alternate;
  }

  @keyframes pulseGlow {
    0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.95; }
  }

  /* Intro UI Card */
  .intro-card {
    position: relative;
    z-index: 5;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    background: rgba(7, 9, 19, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(122, 201, 231, 0.35);
    border-radius: 28px;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 40px var(--primary-glow);
    max-width: 950px;
    width: 85%;
  }

  .stream-title {
    font-size: 2.5rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 6px;
    color: var(--text);
    margin-bottom: 30px;
    text-shadow: 0 0 20px var(--primary-glow);
  }

  .timer-display {
    font-size: 8.5rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: 4px;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 30%, var(--primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 40px rgba(122, 201, 231, 0.5);
    margin-bottom: 35px;
  }

  .progress-container {
    width: 100%;
    height: 16px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(122, 201, 231, 0.2);
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7ac9e7, #ffffff);
    box-shadow: 0 0 20px #7ac9e7;
    transition: width 0.1s linear;
  }

  /* Countdown Linksonderin */
  .corner-countdown {
    position: absolute;
    bottom: 35px;
    left: 40px;
    z-index: 10;
    background: rgba(7, 9, 19, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(122, 201, 231, 0.3);
    border-radius: 16px;
    padding: 16px 24px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
  }

  .corner-countdown .label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .corner-countdown .time {
    font-size: 1.6rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--primary);
    text-shadow: 0 0 12px var(--primary-glow);
  }
</style>
</head>
<body>

<div id="viewport">
  <canvas id="visualizer"></canvas>
  <div class="light-beam"></div>

  <div class="intro-card">
    <div class="stream-title">Birthday stream is starting</div>
    <div class="timer-display" id="timer">10:00</div>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <!-- Countdown linksonderin -->
  <div class="corner-countdown">
    <div class="label">Birthday Countdown</div>
    <div class="time" id="birthday-timer">00d 00h 00m 00s</div>
  </div>
</div>

<!-- Embedded Audio element for loop -->
<audio id="bg-audio" src="music.mp3" loop autoplay></audio>

<script>
const audio = document.getElementById('bg-audio');

// Handle Browser Autoplay policies (start audio on first user interaction if blocked)
function startAudio() {
  audio.play().catch(() => {});
}
window.addEventListener('click', startAudio, { once: true });
window.addEventListener('touchstart', startAudio, { once: true });
window.addEventListener('keydown', startAudio, { once: true });
startAudio();

// Timer Logic (10 Minutes Count Down)
const durationGoal = 600; // 10 Minutes
let timerStartTime = performance.now();

const timerEl = document.getElementById('timer');
const progressBarEl = document.getElementById('progress-bar');

function updateTimer() {
  const elapsed = (performance.now() - timerStartTime) / 1000;
  const remaining = Math.max(0, durationGoal - elapsed);

  const m = Math.floor(remaining / 60);
  const s = Math.floor(remaining % 60);
  timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

  const pct = ((durationGoal - remaining) / durationGoal) * 100;
  progressBarEl.style.width = `${Math.min(100, Math.max(0, pct))}%`;

  if (remaining > 0) {
    requestAnimationFrame(updateTimer);
  } else {
    timerEl.textContent = "00:00";
    audio.pause();
  }
}

requestAnimationFrame(updateTimer);

// Birthday Countdown Logic (Aftellen naar 07-11-2026 00:00)
const targetDate = new Date('2026-11-07T00:00:00').getTime();
const birthdayTimerEl = document.getElementById('birthday-timer');

function updateBirthdayCountdown() {
  const now = new Date().getTime();
  const distance = targetDate - now;

  if (distance < 0) {
    birthdayTimerEl.textContent = "00d 00h 00m 00s";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  birthdayTimerEl.textContent = 
    `${String(days).padStart(2, '0')}d ` +
    `${String(hours).padStart(2, '0')}h ` +
    `${String(minutes).padStart(2, '0')}m ` +
    `${String(seconds).padStart(2, '0')}s`;
}

setInterval(updateBirthdayCountdown, 1000);
updateBirthdayCountdown();

// Background Particle Visualizer (#7ac9e7)
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

for (let i = 0; i < 75; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 3 + 1,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6,
    alpha: Math.random() * 0.5 + 0.25
  });
}

function renderVisualizer() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(122, 201, 231, ${p.alpha})`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#7ac9e7';
    ctx.fill();
  });

  requestAnimationFrame(renderVisualizer);
}
renderVisualizer();
</script>
</body>
</html>
